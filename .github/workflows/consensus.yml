name: Analyst consensus

# Weekdays before the US open (13:17 UTC = 05:17 PST / 06:17 PDT). The free Alpha Vantage key
# allows about 25 calls a day, so each run refreshes the companies with the oldest data.
on:
  schedule:
    - cron: "17 13 * * 1-5"
  workflow_dispatch:
    inputs:
      probe:
        description: "Only print raw answers for IBM (works without a key)"
        type: boolean
        default: false
      only:
        description: "Tickers to refresh first, comma separated"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: consensus
  cancel-in-progress: false

jobs:
  consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        if: ${{ inputs.probe }}
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python3 scripts/consensus.py --probe
      - name: Fetch consensus
        if: ${{ !inputs.probe }}
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          IN_ONLY: ${{ inputs.only }}
        run: python3 scripts/consensus.py --only "$IN_ONLY"
      - name: Commit
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/consensus.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Analyst consensus $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
