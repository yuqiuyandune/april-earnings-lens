name: Backtest data

# Manual only: daily OHLCV since 2015 for the backtest universe, committed to bt/data
# (not part of the site build: build.py only publishes data/).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/bt_fetch.py bt/data
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add bt/data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Backtest data $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
