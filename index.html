<title>April's Earnings Lens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column (max 760px). Generic renderer: index.json → company config + quarter report + promises. Views: home (search + company list) and company/quarter (hero, sticky tabs, modules). */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --line:#E1E4EA; --ink:#14171C; --muted:#5D6573;
  --accent:#2F55D4; --accent-soft:#E7ECFB;
  --good:#1E7F55; --good-soft:#E3F3EA; --bad:#B83A33; --bad-soft:#F8E5E3; --warn:#9A6A12; --warn-soft:#F7EED9;
  --bar:#C9D1E0; --c1:#2F55D4; --c2:#C08A1E; --c3:#1E7F55; --c4:#5D6573; --c5:#14171C;
  --f-display:"Noto Serif SC","Songti SC",Georgia,serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1218; --surface:#171B23; --line:#2A303C; --ink:#E8EAEE; --muted:#9AA3B2;
  --accent:#7D9BFF; --accent-soft:#1E2742;
  --good:#5CC995; --good-soft:#15291F; --bad:#F07C72; --bad-soft:#331A18; --warn:#E3B45A; --warn-soft:#2F2614;
  --bar:#3A4352; --c1:#7D9BFF; --c2:#E3B45A; --c3:#5CC995; --c4:#9AA3B2; --c5:#E8EAEE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#171B23; --line:#2A303C; --ink:#E8EAEE; --muted:#9AA3B2;
  --accent:#7D9BFF; --accent-soft:#1E2742;
  --good:#5CC995; --good-soft:#15291F; --bad:#F07C72; --bad-soft:#331A18; --warn:#E3B45A; --warn-soft:#2F2614;
  --bar:#3A4352; --c1:#7D9BFF; --c2:#E3B45A; --c3:#5CC995; --c4:#9AA3B2; --c5:#E8EAEE; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:30px}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;justify-content:space-between}
.top .sbox{flex:1 1 100%}
.snav{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.snav a{font-size:13px;padding:4px 11px;border-radius:7px;color:var(--muted);text-decoration:none;white-space:nowrap}
.snav a[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:600}

.brand{font-size:12.5px;color:var(--muted);letter-spacing:.05em;text-decoration:none;white-space:nowrap}
.brand b{color:var(--ink);font-weight:700}
.sbox{position:relative;flex:1 1 200px;min-width:0}
.sbox input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.sbox input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:20;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.sres a{display:flex;gap:8px;align-items:baseline;padding:8px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.sres a:last-child{border-bottom:0}
.sres a:hover,.sres a.on{background:var(--accent-soft)}
.sres .tk{font-family:var(--f-num);font-weight:600}
.sres .sm{font-size:12.5px;color:var(--muted)}
.sres .none{padding:10px 12px;font-size:13px;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* home */
.homeh h1{font-family:var(--f-display);font-size:clamp(24px,5vw,32px);margin:0 0 6px;line-height:1.3}
.homeh p{margin:0;color:var(--muted)}
.clist{display:flex;flex-direction:column;gap:10px}
.crow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit}
.crow:hover{border-color:var(--accent)}
.crow .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.crow .l1 .tk{font-family:var(--f-num);font-weight:600;font-size:15px}
.crow .l1 .sm{font-size:12.5px;color:var(--muted)}
.crow .hl{font-family:var(--f-display);font-size:16.5px;line-height:1.45}

/* company hero */
header.hero{display:flex;flex-direction:column;gap:14px}
.ticker{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ticker .sym{font-family:var(--f-num);font-weight:600;font-size:13px;background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:4px}
.ticker .meta{font-size:13px;color:var(--muted)}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qs a,.qs span{font-family:var(--f-num);font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--muted);background:var(--surface)}
.qs a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qs span{opacity:.55;border-style:dashed}
h1{font-family:var(--f-display);font-size:clamp(24px,5.4vw,34px);line-height:1.35;margin:0;text-wrap:balance;font-weight:700}
.verdicts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.verdicts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.v{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.v .k{font-size:12px;color:var(--muted)}
.v .val{font-family:var(--f-num);font-size:18px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.v .exp{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;width:max-content;letter-spacing:.03em;white-space:nowrap;font-family:var(--f-body)}
.p-good{background:var(--good-soft);color:var(--good)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-neutral{background:var(--accent-soft);color:var(--accent)}
.points{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
.points b{font-weight:700}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:-12px 0 -8px;padding-block:8px;display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;gap:2px;border-bottom:1px solid var(--line)}
nav.tabs a{font-size:14.5px;font-weight:500;color:var(--muted);text-decoration:none;text-align:center;border-radius:8px;padding:8px 4px;position:relative}
@media (min-width:560px){nav.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:420px){nav.tabs a{font-size:13.5px;padding:8px 4px}}
nav.tabs a:hover{color:var(--ink);background:var(--surface)}
nav.tabs a[aria-selected="true"]{color:var(--ink);font-weight:700}
nav.tabs a[aria-selected="true"]::after{content:"";position:absolute;left:12%;right:12%;bottom:-9px;height:3px;border-radius:2px;background:var(--accent)}
nav.tabs a:focus-visible,.crow:focus-visible,.qs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tp{display:flex;flex-direction:column;gap:32px}

section{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--f-display);font-size:21px;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;line-height:1.35}
h2 small{font-family:var(--f-body);font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.take{margin:0;font-size:15.5px;max-width:62ch}
.note{font-size:12.5px;color:var(--muted);margin:0;line-height:1.6;max-width:66ch}
.note b{color:var(--ink)}
.sub{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.panel .ph b{color:var(--ink);font-size:14px}

.vp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.vp div{display:flex;flex-direction:column;gap:3px;min-width:0}
.vp .k{font-size:12px;color:var(--muted)}
.vp b{font-family:var(--f-num);font-size:17px;font-weight:600;overflow-wrap:anywhere}
.vp .op{font-size:12px;color:var(--muted)}

.bridge{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:5.5em minmax(0,1fr) 4.6em;align-items:center;gap:8px;font-size:13.5px}
.br .lane{position:relative;height:20px}
.br .lane::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.br .fillbar{position:absolute;top:3px;height:14px;border-radius:3px}
.br .amt{font-family:var(--f-num);font-weight:600;text-align:right}
.br.total{border-top:1px solid var(--line);padding-top:8px;color:var(--muted)}
.segs{display:flex;flex-direction:column;gap:10px}
.seg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px 18px;align-items:center}
.seg.wc{grid-template-columns:minmax(0,1fr) minmax(0,220px)}
@media (max-width:560px){.seg.wc{grid-template-columns:minmax(0,1fr)}}
.seg .left{display:flex;flex-direction:column;gap:5px;min-width:0}
.seg .name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.seg .name i{width:10px;height:10px;border-radius:2px;flex:none}
.seg .name .share{font-weight:400;font-size:12.5px;color:var(--muted)}
.seg .big{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg .big b{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.2}
.seg .why{font-size:13.5px;color:var(--muted);line-height:1.6}
.seg .why b{color:var(--ink);font-weight:500}
svg{width:100%;height:auto;display:block}
svg text{font-family:var(--f-num);font-size:10px;fill:var(--muted)}
svg .lab{fill:var(--ink);font-weight:600}

.stack{display:flex;flex-direction:column;gap:8px}
.nr{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.nbar{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:1px;font-family:var(--f-num);font-size:10.5px;color:var(--bg)}
.nbar span{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.drag{display:flex;flex-direction:column;gap:10px;font-size:14px}
.drag > div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.drag .w{grid-column:1/-1;font-size:13px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;min-width:0;display:flex;flex-direction:column;gap:4px}
.chart .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px}
.chart .t b{font-weight:700}
.chart .t .u{font-size:12px;color:var(--muted);font-weight:400}
.chart .t .now{font-family:var(--f-num);font-weight:600;font-size:16px}
.chart .why{font-size:12.5px;color:var(--muted);line-height:1.55}

.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.vt .k{font-size:12.5px;color:var(--muted)}
.vt b{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.2}
.vt .f{font-size:11.5px;color:var(--muted);font-family:var(--f-num);line-height:1.5}
.tbl{display:flex;flex-direction:column}
.tr{display:grid;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.tr > span:not(:first-child){text-align:right;font-family:var(--f-num);font-weight:600}
.tr.th{font-size:12px;color:var(--muted)} .tr.th > span{font-family:var(--f-body)!important;font-weight:400!important}
.tr:last-child{border-bottom:0}
.tr .good{color:var(--good)} .tr .bad{color:var(--bad)}
.tr.hl{background:var(--accent-soft);margin-inline:-8px;padding-inline:8px;border-radius:6px}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.steps b{color:var(--ink);font-family:var(--f-num)}
.sotp{display:flex;flex-direction:column;gap:12px}
.sl{display:grid;grid-template-columns:6.5em minmax(0,1fr) 3.4em 5.2em;gap:10px;align-items:center;font-size:13.5px}
.sl input{width:100%;accent-color:var(--accent);min-width:0}
.sl .x{font-family:var(--f-num);font-weight:600;text-align:right}
.sl .val{font-family:var(--f-num);color:var(--muted);text-align:right;font-size:12.5px}
@media (max-width:420px){.sl{grid-template-columns:5.5em minmax(0,1fr) 3.2em}.sl .val{display:none}}
.sbar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;font-size:11px;color:var(--bg);font-family:var(--f-num)}
.sbar span{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.ret{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.ret .rh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}.ret .rh b{font-size:14.5px}.ret .rh span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats .k{font-size:12px;color:var(--muted)}
.stats b{font-family:var(--f-num);font-size:18px;font-weight:600}
details.calc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;color:var(--muted)}
details.calc summary{cursor:pointer;color:var(--ink);font-weight:500}
details.calc ul{margin:8px 0 2px;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}

.ledger{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.item .said{font-size:12px;color:var(--muted)}
.item .what{font-weight:500;grid-column:1/-1}
.item .out{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.item .hist{grid-column:1/-1;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px}
.future{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.future{grid-template-columns:minmax(0,1fr)}}
.fi{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.fi .when{font-family:var(--f-num);font-size:12px;color:var(--accent);font-weight:600}
.fi .what{font-size:14px}
.chg{display:flex;flex-direction:column;gap:8px}
.ch{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.ch .tp2{font-weight:500}
.ch .ba{grid-column:1/-1;display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:2px 8px;font-size:13.5px}
.ch .ba span:nth-child(odd){font-size:12px;color:var(--muted);padding-top:2px}
.ch .ba span:nth-child(3){color:var(--muted)}
.call{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.call{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:15px}
.card ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px 18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.empty b{color:var(--ink)}
footer{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:16px}
footer ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px}
.loading{color:var(--muted);font-size:14px;padding:40px 0;text-align:center}
.lang{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.lang button{font:inherit;font-size:12.5px;border:0;background:none;color:var(--muted);padding:3px 8px;border-radius:6px;cursor:pointer;min-width:30px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--accent)}
.stats.pz .f{font-size:11.5px;color:var(--muted);line-height:1.45}
.disc{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin:0;line-height:1.55}
.zh-only{color:var(--warn)}
.v .pill{white-space:normal;max-width:100%;width:auto;align-self:flex-start}
.zlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.zrow{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) minmax(0,10.5em);grid-template-areas:"n a s" "n m s";column-gap:12px;row-gap:2px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.zrow:first-child{border-top:0}
.rvl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:14px}.rvl .tk{font-weight:700;margin-right:4px}
.zrow:hover{background:var(--accent-soft)}
.zrow .zn{grid-area:n;display:flex;flex-direction:column;gap:2px;min-width:0}
.zrow .zax{grid-area:a;position:relative;height:26px;display:block}
.zax i{position:absolute;top:50%;transform:translate(-50%,-50%)}
.zax .zl{left:0;right:0;height:2px;background:var(--line);transform:translateY(-50%)}
.zax .zb{height:16px;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:3px;transform:translateY(-50%);box-sizing:border-box}
.zax .zd{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.zax .zc{width:2.5px;height:24px;background:var(--ink);border-radius:1px}
.zrow .zs{grid-area:s;display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.zrow .zm{grid-area:m}
.zrow .pill{white-space:normal}
@media (max-width:560px){.zrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n s" "a a" "m m"}}
.crow .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.crow .chips .pill,.hsum .pill{white-space:normal}
.hsum{display:flex;flex-direction:column;gap:6px}
.hsum a{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--ink);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}

.lg{display:flex;gap:16px;margin:0;font-size:12.5px;color:var(--muted)}
.lg span{display:flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:16px;height:3px;border-radius:2px}
.lg i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)}
.vdp{border-left:3px solid var(--accent)}
.vgrid.mt{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vgrid.mt .vt{padding:10px 12px}
.vgrid.mt .vt b{font-size:19px}
.dg .dgf{margin:0;font-size:13.5px}
.dg .vd{display:flex;flex-direction:column;gap:3px;font-size:14px;border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.dg .vd span{color:var(--muted)}

  if(v.riskreward){const r=v.riskreward,px=r.price,ips=r.rows.map(o=>o.eps*r.mult),dlo=Math.min(px,...ips)*.985,dhi=Math.max(px,...ips)*1.015,W=320,ax=40,PL=10,X=p=>PL+(p-dlo)/(dhi-dlo)*(W-PL-10);
    const tiles=r.rows.map((o,i)=>{const ip=ips[i],pc=(ip/px-1)*100,up=pc>=0,c=up?"var(--good)":"var(--bad)";return `<div><span class="k">${esc(o.n)} · ${L("rev")}${esc(o.g)}</span><b style="color:${c}">$${ip.toFixed(0)}</b><span style="font-size:12.5px;font-weight:600;font-family:var(--f-num);color:${c}">${up?"+":""}${pc.toFixed(0)}%</span></div>`}).join("");
    let g=`<svg viewBox="0 0 ${W} 66" role="img" aria-label="${esc(r.title)}"><line x1="${X(Math.min(...ips)).toFixed(1)}" x2="${X(px).toFixed(1)}" y1="${ax}" y2="${ax}" stroke="var(--bad)" stroke-width="3"/><line x1="${X(px).toFixed(1)}" x2="${X(Math.max(...ips)).toFixed(1)}" y1="${ax}" y2="${ax}" stroke="var(--good)" stroke-width="3"/>`;
    r.rows.forEach((o,i)=>{const xp=X(ips[i]).toFixed(1);g+=`<circle cx="${xp}" cy="${ax}" r="3.5" fill="var(--ink)"/><text x="${xp}" y="${ax+16}" text-anchor="middle">${esc(o.n)}</text>`});
    g+=`<line x1="${X(px).toFixed(1)}" x2="${X(px).toFixed(1)}" y1="${ax-13}" y2="${ax+5}" stroke="var(--muted)" stroke-width="1.5"/><text x="${X(px).toFixed(1)}" y="${ax-17}" text-anchor="middle" class="lab">${L("pz.now")} $${px.toFixed(0)}</text></svg>`;
    h+=`<div class="panel"><div class="ph"><b>${esc(r.title)}</b><span>${esc(r.sub||"")}</span></div><div class="stats">${tiles}</div>${g}<p class="note">${r.note}</p></div>`}
  if(v.pricezone)h+=mPriceZone(v.pricezone);
  if(v.cons)h+=mCons(v.cons,v.pricezone,co.t);
  if(v.history){const x=v.history,vals=x.values.concat([x.cur]),W=320,H=130,Pd={l:24,r:34,t:12,b:20},max=x.max,n=vals.length,bw=(W-Pd.l-Pd.r)/n,y=t=>Pd.t+(max-t)/max*(H-Pd.t-Pd.b);
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(x.title)}">`;
    x.grid.forEach(g=>{s+=`<line x1="${Pd.l}" x2="${W-Pd.r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="${g?.5:1}"/><text x="${Pd.l-4}" y="${y(g)+3}" text-anchor="end">${g}</text>`});
    vals.forEach((t,i)=>{s+=`<rect x="${(Pd.l+i*bw+bw*.15).toFixed(1)}" y="${y(t).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${(y(0)-y(t)).toFixed(1)}" rx="1.5" fill="${i===n-1?"var(--accent)":"var(--bar)"}"/>`});
    s+=`<line x1="${Pd.l}" x2="${W-Pd.r}" y1="${y(x.med)}" y2="${y(x.med)}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${W-Pd.r+3}" y="${y(x.med)+3}">${L("med")}</text><text x="${W-Pd.r+3}" y="${y(x.cur)+3}" class="lab">${x.cur}</text>`;
    x.years.forEach((t,k)=>{s+=`<text x="${(Pd.l+(k*4+1)*bw).toFixed(1)}" y="${H-5}">${t}</text>`});
    h+=`<div class="panel"><div class="ph"><b>${esc(x.title)}</b><span>${esc(x.sub)}</span></div>${s}</svg><p class="note">${x.note}</p></div>`}
  if(v.decomp)h+=`<div class="panel"><div class="ph"><b>${esc(v.decomp.title)}</b><span>${esc(v.decomp.sub)}</span></div>${tbl(v.decomp.head,v.decomp.rows,"minmax(0,1fr) 6em 6em")}<p class="note">${v.decomp.note}</p></div>`;
  const rb=retBlock(co,q,v.cash&&v.cash.ret);
  if(v.cash){const w=v.cash.m?seriesWindow(co,v.cash.m,q):{vals:v.cash.d,labels:v.cash.labels,m:{dec:0}},unit=v.cash.unit||"";h+=`<div class="panel"><div class="ph"><b>${esc(v.cash.title)}</b><span>${esc(v.cash.sub||"")}</span></div>${v.cash.stats?`<div class="stats">${v.cash.stats.map(s=>`<div><span class="k">${esc(s.k)}</span><b style="${s.tone==="bad"?"color:var(--bad)":""}">${esc(s.v)}</b></div>`).join("")}</div>`:""}${bars(w.vals,w.labels,{W:320,H:110,f:x=>fmt(x,w.m.dec)+unit,label:v.cash.title})}<p class="note">${v.cash.note}</p>${rb}</div>`}
  else if(rb)h+=`<div class="panel">${rb}</div>`;
  if(v.sotp)h+=`<div class="panel"><div class="ph"><b>${esc(v.sotp.title)}</b><span>${L("drag")}</span></div><p class="note" style="color:var(--ink)">${v.sotp.intro}</p><div class="sotp" id="sotp"></div><div class="sbar" id="sbar"></div><p class="take" id="sotp-out"></p><p class="note">${v.sotp.note}</p></div>`;
  if(v.calc)h+=`<details class="calc"><summary>${L("calc")}</summary><ul>${v.calc.map(c=>`<li>${c}</li>`).join("")}</ul></details>`;
  if(v.next)h+=`<p class="note">${v.next}</p>`;
  return h+"</section>";
}
/* scenario prices + author's zone: price axis, % vs current, risk/reward at current price and at zone midpoint */
function mPriceZone(z){
  const lv=z.live,px=lv?lv.c:z.price,S=z.scen,[lo,hi]=z.zone,mid=(lo+hi)/2,bear=S[0].p,base=S[1].p,bull=S[2].p;
  const all=[px,lo,hi,...S.map(s=>s.p)],dlo=Math.min(...all)*.9,dhi=Math.max(...all)*1.04,W=320,PL=8,PR=8,X=p=>PL+(p-dlo)/(dhi-dlo)*(W-PL-PR),ax=46;
  const $p=p=>"$"+(p>=1000?Math.round(p).toLocaleString("en-US"):p>=100?p.toFixed(0):p.toFixed(1));
  const pc=(a,b)=>{const v=(a/b-1)*100;return `${v>=0?"+":"−"}${Math.abs(v).toFixed(0)}%`};
  let g=`<svg viewBox="0 0 ${W} 104" role="img" aria-label="${esc(L("pz.title"))}">`;
  g+=`<rect x="${X(lo).toFixed(1)}" y="${ax-14}" width="${(X(hi)-X(lo)).toFixed(1)}" height="28" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-dasharray="3 2"/>`;
  g+=`<text x="${Math.min(W-78,Math.max(78,(X(lo)+X(hi))/2)).toFixed(1)}" y="${ax+52}" text-anchor="middle" style="fill:var(--accent)">${esc(L("pz.zone"))} ${$p(lo)}–${$p(hi)}</text>`;
  g+=`<line x1="${PL}" x2="${W-PR}" y1="${ax}" y2="${ax}" stroke="var(--line)" stroke-width="2"/>`;
  S.forEach((s,i)=>{const x=X(s.p).toFixed(1),tx=Math.min(W-20,Math.max(20,X(s.p))).toFixed(1),c=["var(--bad)","var(--ink)","var(--good)"][i];g+=`<circle cx="${x}" cy="${ax}" r="4.5" fill="${c}"/><text x="${tx}" y="${ax+22}" text-anchor="middle">${esc(s.n)}</text><text x="${tx}" y="${ax+35}" text-anchor="middle" class="lab">${$p(s.p)}</text>`});
  g+=`<line x1="${X(px).toFixed(1)}" x2="${X(px).toFixed(1)}" y1="${ax-12}" y2="${ax+12}" stroke="var(--accent)" stroke-width="2.5"/><text x="${X(px).toFixed(1)}" y="12" text-anchor="middle" class="lab">${esc(L(lv?"pz.atLast":"pz.now"))} ${$p(px)}</text></svg>`;
  const tiles=S.map(s=>{const up=s.p>=px;return `<div><span class="k">${esc(s.n)}</span><b style="color:${up?"var(--good)":"var(--bad)"}">${$p(s.p)}</b><span class="f">${pc(s.p,px)} · ${esc(s.how)}</span></div>`}).join("");
  const rr=p=>{const dn=(1-bear/p)*100,up=(base/p-1)*100;return dn<=0||up<=0?"—":(up/dn>10?">10×":(up/dn).toFixed(1)+"×")};
  const row=(lab,p,hl)=>({hl,c:[lab,$p(p),pc(bear,p),pc(base,p),pc(bull,p),rr(p)],tone:["","","bad",base>=p?"good":"bad",bull>=p?"good":"bad",""]});
  const t=tbl([L("pz.from"),L("pz.px"),L("pz.toBear"),L("pz.toBase"),L("pz.toBull"),L("pz.rr")],[...(lv?[row(L("pz.atLast"),px),row(L("pz.atSet"),z.price)]:[row(L("pz.atNow"),px)]),row(L("pz.atMid"),mid,true),row(L("pz.atLo"),lo)],"minmax(0,1.3fr) repeat(5,minmax(0,1fr))");
  return `<div class="panel"><div class="ph"><b>${esc(z.title||L("pz.title"))}</b><span>${esc(z.sub||"")}</span></div>
  ${z.status==="review"?`<p class="disc">${L("pz.reviewing")}</p>`:""}${lv?`<p class="note" style="margin:0">${L("pz.live",md(z.on),$p(z.price),$$(lv.c),md(lv.d))}</p>`:""}
  <div class="stats pz">${tiles}</div>${g}
  <p style="margin:0;font-size:14px">${L("pz.zoneIs")} <b class="num">${$p(lo)}–${$p(hi)}</b>${L("stop")}${z.why}</p>${t}
  <p class="note">${L("pz.rrNote")}</p>${z.note?`<p class="note">${z.note}</p>`:""}
  <p class="disc">${L("pz.disc")}</p></div>`;
}
function wireSotp(s){if(!s)return;const box=$("#sotp");if(!box)return;
  box.innerHTML=s.parts.map((p,i)=>`<label class="sl" for="sl${i}"><span>${esc(p.n)}</span><input type="range" id="sl${i}" min="0.5" max="10" step="0.1" value="${p.def}"><span class="x" id="sl${i}x"></span><span class="val" id="sl${i}v"></span></label>`).join("");
  const upd=()=>{let core=0;const vals=s.parts.map((p,i)=>{const m=+$("#sl"+i).value,v=m*p.rev;core+=v;$("#sl"+i+"x").textContent=m.toFixed(1)+"×";$("#sl"+i+"v").textContent="$"+v.toFixed(0)+"B";return v});
    const rest=Math.max(0,s.ev-core),pc=rest/s.ev*100;
    $("#sbar").innerHTML=vals.map((v,i)=>`<span style="flex:${v};background:${col(s.parts[i].c)}"></span>`).join("")+`<span style="flex:${rest};background:var(--muted)">${L("sotpRest")} ${pc.toFixed(0)}%</span>`;
    $("#sotp-out").innerHTML=L("sotpOut",core.toFixed(0),s.ev.toFixed(0),rest.toFixed(0),pc.toFixed(0))};
  s.parts.forEach((p,i)=>$("#sl"+i).addEventListener("input",upd));upd()}

function mManagement(m,pr,q){
  const checks=pr.filter(p=>(p.checks||[]).some(c=>c.q===q));
  const made=pr.filter(p=>p.made===q);
  let h=`<section><h2>${L("ledger")} <small>PROMISE LEDGER</small></h2>`;
  h+=checks.length?`<div class="ledger">${checks.map(p=>{const c=p.checks.find(c=>c.q===q),prev=p.checks.filter(c=>c.q<q);
    return `<div class="item"><span class="said">${esc(p.saidLabel)}</span>${P(c.status,c.tone)}<span class="what">${esc(p.text)}</span><span class="out">${c.note}</span>${prev.length?`<span class="hist">${prev.map(x=>`<span>${qLabel(x.q)}：${esc(x.status)} · ${x.note}</span>`).join("")}</span>`:""}</div>`}).join("")}</div>`
    :`<div class="empty"><b>${L("first")}</b><span>${L("firstNote")}</span></div>`;
  if(made.length)h+=`<div class="sub">${L("newProm")}</div><div class="future">${made.map(p=>`<div class="fi"><span class="when">${esc(p.dueLabel)}</span><span class="what">${esc(p.text)}</span></div>`).join("")}</div>`;
  h+=`</section>`;
  if(m.changes)h+=`<section><h2>${L("changed")} <small>WHAT CHANGED</small></h2><div class="chg">${m.changes.map(c=>`<div class="ch"><span class="tp2">${esc(c.topic)}</span>${P(c.pill,c.tone)}<div class="ba"><span>${L("before")}</span><span>${c.before}</span><span>${L("now")}</span><span>${c.now}</span></div></div>`).join("")}</div></section>`;
  h+=`<section><h2>${L("call")} <small>EARNINGS CALL</small></h2><div class="call">${m.call.map(c=>`<div class="card"><h3>${esc(c.h)}</h3><ul>${c.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")}</div></section>`;
  return h;
}

function mInsider(x){return `<section><h2>${L("insider")} <small>INSIDER FLOW</small></h2><div class="empty"><b>${esc(x.title)}</b><span>${x.text}</span></div></section>`}

const TABS=["results","valuation","management","market","insider"];
async function company(t,q,tab){
  const idx=INDEX.find(c=>c.t===t);if(!idx)return `<div class="empty"><b>${L("nf",esc(t))}</b><span>${L("nfTry")}</span></div>`;
  q=idx.quarters.includes(q)?q:idx.latest;tab=TABS.includes(tab)?tab:"results";
  await loadMkt();
  const [co,r,pr]=await Promise.all([getJSON(`${DATA()}companies/${t}.json`),getJSON(`${DATA()}reports/${t}/${q}.json`),getJSON(`${DATA()}promises/${t}.json`)]);
  const R=r.results,parts={
    results:(R.volprice?mVolPrice(R.volprice):"")+mSegments(R.segments,co,q)+(R.extras||[]).map(mExtra).join("")+mTrends(R.trends,co,q),
    valuation:mValuation(withCons(livePZ(r,co,idx),r,co,idx),co,q),
    management:mManagement(r.management,pr,q),
    market:mMarket(co,r),
    insider:mInsider(r.insider)};
  document.title=`${co.t} ${co.n} ${qLabel(q)} · April's Earnings Lens`;
  return {html:hero(co,r,idx)+`<nav class="tabs" role="tablist" aria-label="${L("sections")}">${TABS.map(k=>`<a role="tab" href="#${t}.${q}.${k}" aria-selected="${k===tab}">${L("tab."+k)}</a>`).join("")}</nav>
    <div class="tp" role="tabpanel">${parts[tab]}</div>
    <footer>${r._zhOnly?`<span class="zh-only">${L("zhOnly")}</span>`:""}<span>${L("foot",esc(r.asOf))}</span><span>${L("src")}</span><ol>${r.sources.map(s=>`<li><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a></li>`).join("")}</ol></footer>`,
    after:()=>{if(tab==="valuation")wireSotp(r.valuation.sotp)}};
}

let lastKey="";
function setNav(k){document.querySelectorAll(".snav a[data-nav]").forEach(a=>{if(a.dataset.nav===k)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}
async function route(){
  const h=decodeURIComponent(location.hash.slice(1));const [t,q,tab]=h.split(".");
  const app=$("#app");const key=`${t}.${q}`;
  try{
    setNav(t==="zones"?"zones":(!t||t==="home")?"home":"");
    if(t==="zones"){await loadMkt();app.innerHTML=`<div class="tp">${zonesPage()}</div>`;document.title=L("zp.h1")+" · April's Earnings Lens";window.scrollTo(0,0);lastKey="";return}
    if(!t||t==="home"){await loadMkt();app.innerHTML=`<div class="tp">${home()}</div>`;document.title="April's Earnings Lens";lastKey="";return}
    const res=await company(t.toUpperCase(),q,tab);
    if(typeof res==="string"){app.innerHTML=res;return}
    const tabsEl=app.querySelector("nav.tabs"),stuck=tabsEl&&tabsEl.getBoundingClientRect().top<=1;
    app.innerHTML=`<div class="tp">${res.html}</div>`;res.after();
    if(key!==lastKey)window.scrollTo(0,0);else if(stuck)app.querySelector("nav.tabs").scrollIntoView({block:"start"});
    lastKey=key;
  }catch(e){app.innerHTML=`<div class="empty"><b>${L("err")}</b><span>${L("errTry")} (${esc(e.message)})</span></div>`}
}
window.addEventListener("hashchange",route);
function boot(){INDEX=[];lastKey="";paintUI();getJSON(DATA()+"index.json").then(d=>{INDEX=d.companies;route()}).catch(()=>{$("#app").innerHTML=`<div class="empty"><b>${L("err")}</b><span>${L("errTry")}</span></div>`})}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.l===LANG)return;LANG=b.dataset.l;try{localStorage.setItem("sif-lang",LANG)}catch(e){}boot()}));
boot();
</script>
